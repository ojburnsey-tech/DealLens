name: Verify DealLens site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEALLENS_PUBLIC_API_URL: ${{ vars.DEALLENS_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Check generated page matches research and source
        run: python scripts/build_frontend_preview.py --check
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check Python code
        run: |
          python -m ruff check .
          python -m mypy src/deallens
      - name: Check browser script syntax
        run: node --check src/deallens/frontend/app.js
